name: Check benchmark snapshots

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check snapshot age
        id: snapshot-check
        continue-on-error: true
        env:
          BENCHMARK_MAX_AGE_DAYS: "45"
        run: node .vitepress/scripts/check-benchmark-snapshots.mjs
      - name: Open or update maintenance issue
        if: steps.snapshot-check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "复核模型榜单快照";
            const body = [
              "模型评测专题的一个或多个 `benchmark-snapshot` 已超过 45 天，或缺少日期。",
              "请逐行打开课程中的官方直链，更新页面日期、版本、前列模型、可信度和限制。",
              "本次工作流日志包含具体文件。"
            ].join("\n\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "benchmark-maintenance",
              per_page: 20
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `${body}\n\n工作流运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body}\n\n工作流运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ["benchmark-maintenance"]
              });
            }
