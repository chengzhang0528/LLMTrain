data_path: ../data/sample.txt
output_dir: ../outputs/gpu-small
seed: 42
device: cuda
batch_size: 32
block_size: 128
max_steps: 2000
eval_interval: 200
eval_iters: 30
log_interval: 50
learning_rate: 0.0005
weight_decay: 0.1
grad_clip: 1.0
train_fraction: 0.9
generate_prompt: "小"
generate_tokens: 240
temperature: 0.75
top_k: 30
model:
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.1
