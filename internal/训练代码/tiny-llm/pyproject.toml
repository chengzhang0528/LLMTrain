[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm-course"
version = "0.1.0"
description = "A small decoder-only language model for learning the training loop"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "PyYAML>=6,<7",
  "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
