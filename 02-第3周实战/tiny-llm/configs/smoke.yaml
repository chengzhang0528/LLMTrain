data_path: ../data/sample.txt
output_dir: ../outputs/smoke
seed: 42
device: auto
batch_size: 4
block_size: 32
max_steps: 20
eval_interval: 10
eval_iters: 3
log_interval: 5
learning_rate: 0.001
weight_decay: 0.01
grad_clip: 1.0
train_fraction: 0.9
generate_prompt: "小"
generate_tokens: 60
temperature: 0.8
top_k: 12
model:
  n_layer: 1
  n_head: 2
  n_embd: 32
  dropout: 0.0
