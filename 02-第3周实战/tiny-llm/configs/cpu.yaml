data_path: ../data/sample.txt
output_dir: ../outputs/cpu
seed: 42
device: cpu
batch_size: 16
block_size: 64
max_steps: 800
eval_interval: 100
eval_iters: 20
log_interval: 50
learning_rate: 0.001
weight_decay: 0.01
grad_clip: 1.0
train_fraction: 0.9
generate_prompt: "小"
generate_tokens: 180
temperature: 0.75
top_k: 20
model:
  n_layer: 2
  n_head: 4
  n_embd: 64
  dropout: 0.1
